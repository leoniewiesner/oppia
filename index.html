notify('Mindestens vier Antworten erforderlich.',true);row.remove();reindex()};$('#options').append(row)}function reindex(){ $$('#options .option').forEach((r,i)=>{r.querySelector('input[type=radio]').value=i;r.querySelector('.optText').placeholder=`Antwort ${i+1}`})}options.forEach((o,i)=>addOption(o,i===selected));$('#addOption').onclick=()=>addOption();function typeView(){$('#mcFields').hidden=$('#type').value!=='multiple_choice';$('#openFields').hidden=$('#type').value!=='open'}$('#type').onchange=typeView;typeView();async function showImages(){let out='';for(let i=0;i<state.images.length;i++){let x=state.images[i],url=await imageUrl(x.path);out+=`<div class="card"><img class="att" src="${esc(url||'')}" alt="Kartenbild"><div class="row"><select data-place="${i}" style="max-width:180px"><option value="question" ${x.placement==='question'?'selected':''}>Bei der Frage</option><option value="answer" ${x.placement==='answer'?'selected':''}>Bei der Antwort</option></select><button type="button" class="danger" data-img-remove="${i}">Entfernen</button></div></div>`}$('#imageList').innerHTML=out;document.querySelectorAll('[data-img-remove]').forEach(b=>b.onclick=()=>{state.images.splice(+b.dataset.imgRemove,1);showImages()});document.querySelectorAll('[data-place]').forEach(s=>s.onchange=()=>state.images[+s.dataset.place].placement=s.value)}showImages();$('#imageInput').onchange=async e=>{try{for(let file of e.target.files){if(!file.type.startsWith('image/'))throw Error('Bitte nur Bilder auswählen.');if(file.size>8*1024*1024)throw Error('Bilder dürfen maximal 8 MB groß sein.');let path=`${state.user.id}/${uid()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let {error:e}=await db.storage.from('card-images').upload(path,file,{contentType:file.type});if(e)throw e;state.images.push({path,placement:'question'})}await showImages()}catch(x){error(x)}};async function save(next){try{let type=$('#type').value,question=$('#question').value.trim(),answer=type==='open'?$('#answer').value.trim()||null:null;if(!question)throw Error('Bitte eine Frage eingeben.');let opts=null,correct=null;if(type==='multiple_choice'){opts=$$('#options .optText').map(x=>x.value.trim());if(opts.length<4||opts.some(x=>!x))throw Error('Mindestens vier ausgefüllte Antworten sind nötig.');let selected=$('#options input[type=radio]:checked');if(!selected)throw Error('Bitte eine richtige Antwort auswählen.');correct=+selected.value}let duplicate=state.cards.find(x=>x.subject_id===state.subject&&x.id!==state.editing&&x.question.trim().toLocaleLowerCase()===question.toLocaleLowerCase());if(duplicate&&!confirm('Diese Frage gibt es bereits. Trotzdem speichern?'))return;let payload={subject_id:state.subject,type,question,answer,options:opts,correct_option:correct,images:state.images};let result=state.editing?await db.from('flashcards').update(payload).eq('id',state.editing):await db.from('flashcards').insert(payload);if(result.error)throw result.error;await load();if(next){state.editing=null;state.images=[];editor();notify('Gespeichert. Nächste Karte!')}else{go('cards');notify('Karte gespeichert.')}}catch(x){error(x)}}$('#cardForm').onsubmit=e=>{e.preventDefault();save(false)};$('#saveNext').onclick=()=>save(true)}
function $$(s){return [...document.querySelectorAll(s)]}async function imageUrl(path){if(!path)return null;let {data,error:e}=await db.storage.from('card-images').createSignedUrl(path,3600);return e?null:data.signedUrl}async function cardImages(c,placement){let images=(c.images||[]).filter(x=>x.placement===placement);return (await Promise.all(images.map(async x=>{let url=await imageUrl(x.path);return url?`<img class="att" src="${esc(url)}" alt="Kartenbild">`:''}))).join('')}
function studySetup(){let n=cardsOf(state.subject).length;shell(`<h1>Lernen · ${esc(subjectName(state.subject))}</h1><div class="card"><p>${n} Karten verfügbar</p><label>Kartentyp</label><select id="filter"><option value="all">Alle Karten</option><option value="multiple_choice">Nur Multiple Choice</option><option value="open">Nur offene Fragen</option></select><label>Auswahl</label><select id="pool"><option value="all">Alle Karten</option><option value="due">Fällige Wiederholungen</option><option value="unseen">Noch nicht gelernt</option><option value="wrong">Häufig falsch beantwortet</option></select><label>Reihenfolge</label><select id="order"><option value="random">Zufällig</option><option value="original">Erstellungsreihenfolge</option></select><div class="actions"><button id="start">Lernen starten</button><button class="secondary" id="back">Zurück</button></div></div>`);$('#back').onclick=()=>go('cards');$('#start').onclick=()=>{let list=cardsOf(state.subject).filter(c=>$('#filter').value==='all'||c.type===$('#filter').value);if($('#pool').value==='due')list=list.filter(due);if($('#pool').value==='unseen')list=list.filter(c=>!prog(c.id)?.times_seen);if($('#pool').value==='wrong')list=list.filter(c=>(prog(c.id)?.times_wrong||0)>0).sort((a,b)=>(prog(b.id)?.times_wrong||0)-(prog(a.id)?.times_wrong||0));if($('#order').value==='random')list=shuffle(list);else list.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));if(!list.length)return notify('Für diese Auswahl sind keine Karten vorhanden.',true);state.session={cards:list,index:0,started:Date.now(),results:[],shown:false,choice:null,order:null};go('study')}}
async function studyView(){
 let s=state.session;if(!s)return go('studySetup');if(s.index>=s.cards.length)return finishStudy();

 shell(`<div class="row between"><h1>Lernmodus</h1><button class="secondary" id="exit">Beenden</button></div><div class="card"><p class="muted">Karte ${s.index+1} von ${s.cards.length}</p><div class="progress"><div style="width:${100*s.index/s.cards.length}%"></div></div><p class="question">${esc(c.question)}</p><div id="questionImgs"></div>${mc?`<div id="options">${s.order.map(o=>`<label class="option"><input type="radio" name="answer" value="${o.index}" ${s.choice===o.index?'checked':''}><span>${esc(o.text)}</span></label>`).join('')}</div>`:`<label for="studyText">Deine Antwort</label><textarea id="studyText" placeholder="Schreibe deine Antwort hier …" ${s.shown?'readonly':''}></textarea>`}<div id="reveal" ${s.shown?'':'hidden'}><hr class="divider"><h3>${mc?'Richtige Antwort':'Musterantwort'}</h3><p class="answer">${esc(mc?c.options[c.correct_option]:c.answer||'Keine Musterantwort hinterlegt.')}</p><div id="answerImgs"></div>${mc?'<div class="actions"><button id="studyNext">Weiter →</button></div>':'<p class="muted">Wie gut hast du die Frage beantwortet?</p><div class="actions"><button class="danger" id="wrong">Nicht gewusst</button><button class="secondary" id="hard">Schwer</button><button id="right">Gewusst</button></div>'}</div><div class="actions" id="before" ${s.shown?'hidden':''}><button id="show">${mc?'Antwort prüfen':'Antwort anzeigen'}</button></div></div>`);

function markStudyOptions(c,chosen){document.querySelectorAll('#options .option').forEach(label=>{const radio=label.querySelector('input[name=answer]');if(!radio)return;const index=Number(radio.value);label.classList.toggle('learn-correct',index===c.correct_option);label.classList.toggle('learn-wrong',index===chosen&&chosen!==c.correct_option);radio.disabled=true})}
async function updateProgress(c,grade){let p=prog(c.id);let seen=(p?.times_seen||0)+1,correct=(p?.times_correct||0)+(grade===2?1:0),wrong=(p?.times_wrong||0)+(grade===0?1:0);let previous=p?.last_reviewed?Math.max(1,Math.round((new Date(p.next_review)-new Date(p.last_reviewed))/86400000)):1;let days=grade===0?1:grade===1?Math.max(1,Math.round(previous*1.5)):Math.max(2,Math.round(previous*2.5));let next=new Date(Date.now()+days*86400000).toISOString();let {error:e}=await db.from('study_progress').upsert({user_id:state.user.id,flashcard_id:c.id,times_seen:seen,times_correct:correct,times_wrong:wrong,last_reviewed:new Date().toISOString(),next_review:next},{onConflict:'user_id,flashcard_id'});if(e)throw e;state.progress=await query('study_progress',{eq:{user_id:state.user.id}})}
async function finishStudy(){let s=state.session;if(!s)return go('cards');state.session=null;let duration=Math.max(1,Math.round((Date.now()-s.started)/1000));try{let {error:e}=await db.from('study_sessions').insert({user_id:state.user.id,subject_id:state.subject,started_at:new Date(s.started).toISOString(),finished_at:new Date().toISOString(),duration_seconds:duration,cards_reviewed:s.results.length});if(e)throw e;await load();go('cards');notify(`Lerneinheit beendet: ${s.results.length} Karten in ${Math.round(duration/60)} Minuten.`)}catch(x){error(x)}}
function examSetup(){let cards=cardsOf(state.subject),mc=cards.filter(c=>c.type==='multiple_choice').length,open=cards.filter(c=>c.type==='open').length;shell(`<h1>Klausur · ${esc(subjectName(state.subject))}</h1><div class="card"><h2>Deine Prüfung</h2><p>Zuerst 14 zufällige Multiple-Choice-Fragen, danach 6 zufällige offene Fragen, ohne doppelte Fragen.</p><p><strong>Bearbeitungszeit:</strong> 90 Minuten</p><p class="muted">Vorhanden: ${mc} Multiple Choice und ${open} offene Fragen.</p>${mc<14||open<6?'<div class="notice error">Für die Klausur fehlen noch Fragen.</div>':''}<div class="actions"><button id="start" ${mc<14||open<6?'disabled':''}>Klausur starten</button><button id="back" class="secondary">Zurück</button></div></div>`);$('#back').onclick=()=>go('cards');$('#start').onclick=()=>startExam()}
async function startExam(){try{let cards=cardsOf(state.subject),chosen=[...shuffle(cards.filter(c=>c.type==='multiple_choice')).slice(0,14),...shuffle(cards.filter(c=>c.type==='open')).slice(0,6)];let {data,error:e}=await db.from('exams').insert({user_id:state.user.id,subject_id:state.subject,duration_minutes:90}).select().single();if(e)throw e;let answers=chosen.map((c,i)=>({exam_id:data.id,flashcard_id:c.id,question_order:i+1}));let r=await db.from('exam_answers').insert(answers);if(r.error)throw r.error;state.exam={id:data.id,started:new Date(data.started_at).getTime(),cards:chosen,index:0,answers:{},submitted:false};go('exam')}catch(x){error(x)}}
let examInterval=null;async function examView(){let ex=state.exam;if(!ex)return go('examSetup');if(examInterval)clearInterval(examInterval);let c=ex.cards[ex.index],left=Math.max(0,90*60-Math.floor((Date.now()-ex.started)/1000));if(left<=0)return submitExam();let current=ex.answers[c.id]||{};shell(`<div class="row between"><h1>Klausur</h1><strong id="timer">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</strong></div><div class="card"><p class="muted">Frage ${ex.index+1} / 20 · ${c.type==='multiple_choice'?'Multiple Choice':'Offene Frage'}</p><div class="row">${ex.cards.map((x,i)=>`<button class="${i===ex.index?'':'secondary'}" data-jump="${i}" style="padding:8px 11px">${i+1}${ex.answers[x.id]?.value!==undefined?' ✓':''}</button>`).join('')}</div><hr class="divider"><p class="question">${esc(c.question)}</p><div id="questionImgs"></div><div id="response"></div><div class="actions"><button id="prev" class="secondary" ${ex.index===0?'disabled':''}>← Zurück</button><button id="next" class="secondary" ${ex.index===19?'disabled':''}>Weiter →</button><button id="submit">Klausur abgeben</button></div></div>`);$('#questionImgs').innerHTML=await cardImages(c,'question');if(c.type==='multiple_choice'){let opts=ex.answers[c.id]?.order||shuffle(c.options.map((text,index)=>({text,index})));ex.answers[c.id]={...current,order:opts};$('#response').innerHTML=opts.map(o=>`<label class="option"><input type="radio" name="examChoice" value="${o.index}" ${current.value===o.index?'checked':''}><span>${esc(o.text)}</span></label>`).join('');$$('input[name=examChoice]').forEach(r=>r.onchange=()=>ex.answers[c.id]={...ex.answers[c.id],value:+r.value})}else{$('#response').innerHTML='<label>Deine Antwort</label><textarea id="examText" placeholder="Schreibe hier deine Antwort …"></textarea>';$('#examText').value=current.value||'';$('#examText').oninput=e=>ex.answers[c.id]={...ex.answers[c.id],value:e.target.value}}$$('[data-jump]').forEach(b=>b.onclick=()=>{ex.index=+b.dataset.jump;go('exam')});$('#prev').onclick=()=>{ex.index--;go('exam')};$('#next').onclick=()=>{ex.index++;go('exam')};$('#submit').onclick=()=>{if(confirm('Klausur jetzt abgeben? Unbeantwortete Fragen zählen als falsch.'))submitExam()};examInterval=setInterval(()=>{let t=Math.max(0,90*60-Math.floor((Date.now()-ex.started)/1000));let timer=$('#timer');if(timer)timer.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;if(t<=0){clearInterval(examInterval);submitExam()}},1000)}
async function submitExam(){let ex=state.exam;if(!ex||ex.submitted)return;ex.submitted=true;if(examInterval)clearInterval(examInterval);try{let rows=ex.cards.map((c,i)=>{let a=ex.answers[c.id]||{},isMc=c.type==='multiple_choice',correct=isMc?a.value===c.correct_option:null;return {exam_id:ex.id,flashcard_id:c.id,question_order:i+1,selected_option:isMc&&typeof a.value==='number'?a.value:null,written_answer:!isMc?(a.value||''):null,is_correct:correct,points:isMc?(correct?1:0):null}});let r=await db.from('exam_answers').upsert(rows,{onConflict:'exam_id,flashcard_id'});if(r.error)throw r.error;let r2=await db.from('exams').update({finished_at:new Date().toISOString(),status:'completed'}).eq('id',ex.id);if(r2.error)throw r2.error;state.exam=null;await load();await gradeExam(ex.id)}catch(x){ex.submitted=false;error(x)}}
async function gradeExam(id){
 try{
  let answers=await query('exam_answers',{eq:{exam_id:id}}),open=answers.filter(a=>a.is_correct===null);
  if(!open.length){state.reviewExamId=id;return go('examReview')}
  let html=`<h1>Klausur auswerten</h1><div class="card"><p>Multiple Choice: <strong>${answers.filter(a=>a.is_correct===true).length} von 14 richtig</strong></p><p>Bewerte jetzt die 6 offenen Antworten selbst. Jede Frage zählt einen Punkt.</p></div>`;
  for(let a of open){let c=state.cards.find(x=>x.id===a.flashcard_id);html+=`<div class="card"><p class="question">${esc(c?.question||'Karte wurde gelöscht')}</p><h3>Deine Antwort</h3><p class="answer">${esc(a.written_answer||'Nicht beantwortet')}</p><h3>Musterantwort</h3><p class="answer">${esc(c?.answer||'Keine Musterantwort hinterlegt.')}</p><div id="ansimg-${a.id}"></div><label>Bewertung</label><select data-grade="${a.id}"><option value="0">0 Punkte – falsch / leer</option><option value="1" ${a.points===1?'selected':''}>1 Punkt – richtig</option></select></div>`}
  html+=`<div class="card"><button id="finishGrade">Auswertung speichern & alle Fragen ansehen</button></div>`;shell(html);
  for(let a of open){let c=state.cards.find(x=>x.id===a.flashcard_id);if(c)$('#ansimg-'+a.id).innerHTML=await cardImages(c,'answer')}
  $('#finishGrade').onclick=async()=>{try{
   for(let el of $$('[data-grade]')){let pts=+el.value;let {error:e}=await db.from('exam_answers').update({points:pts,is_correct:pts===1}).eq('id',el.dataset.grade);if(e)throw e}
   let updated=await query('exam_answers',{eq:{exam_id:id}}),score=100*updated.reduce((sum,a)=>sum+(Number(a.points)||0),0)/20;
   let {error:e}=await db.from('exams').update({score}).eq('id',id);if(e)throw e;
   await load();state.reviewExamId=id;go('examReview')
  }catch(x){error(x)}}
 }catch(x){error(x)}
}
async function examReview(){
 let id=state.reviewExamId,exam=state.exams.find(e=>e.id===id);
 if(!exam)return go('stats');
 try{
  let answers=(await query('exam_answers',{eq:{exam_id:id}})).sort((a,b)=>a.question_order-b.question_order);
  let graded=answers.every(a=>a.is_correct!==null);
  let correct=answers.filter(a=>a.is_correct===true).length;
  let html=`<div class="row between"><h1>Klausur vollständig ansehen</h1><button class="secondary" id="backStats">← Statistik</button></div><div class="card"><h2>${esc(subjectName(exam.subject_id))}</h2><p class="muted">${fmt(exam.finished_at||exam.started_at)} · ${answers.length} Fragen</p><div class="stat">${exam.score===null?'Bewertung offen':Number(exam.score).toFixed(0)+' %'}</div><p>${correct} von ${answers.length} Fragen richtig bewertet.</p>${!graded?'<div class="notice">Die offenen Antworten dieser Klausur müssen noch bewertet werden.</div>':''}<div class="actions"><button class="secondary" id="practiceWrong">Falsche Fragen erneut lernen</button>${!graded?'<button id="continueGrade">Offene Antworten bewerten</button>':''}</div></div>`;
  for(let a of answers){let c=state.cards.find(x=>x.id===a.flashcard_id),mc=c?.type==='multiple_choice'||(!c&&a.selected_option!==null);
   let result=a.is_correct===null?'⚪ Noch nicht bewertet':a.is_correct?'🟢 Richtig':'🔴 Falsch';
   html+=`<div class="card"><div class="row between"><span class="pill">Frage ${a.question_order} · ${mc?'Multiple Choice':'Offene Frage'}</span><strong>${result}</strong></div><p class="question">${esc(c?.question||'Diese Karte wurde inzwischen gelöscht.')}</p><div id="reviewQuestion-${a.id}"></div>`;
   if(mc&&c){
    html+=`<div class="small muted">Deine Auswahl ist markiert. Grün = richtige Antwort, Rot = falsche Auswahl.</div>`;
    for(let i=0;i<(c.options||[]).length;i++){
     let chosen=a.selected_option===i,right=c.correct_option===i;
     let bg=right?'background:#e8f8ee;border-color:#74bd92':chosen?'background:#fff0f0;border-color:#e7a0aa':'';
     html+=`<div class="option" style="${bg}"><span>${right?'✓ ':chosen?'✗ ':''}${esc(c.options[i])}${chosen?' <strong>(deine Antwort)</strong>':''}${right?' <strong>(richtig)</strong>':''}</span></div>`;
    }
    if(a.selected_option===null)html+='<p class="muted">Du hast keine Antwort ausgewählt.</p>';
   }else if(mc){html+='<p class="muted">Antwortmöglichkeiten sind nicht mehr verfügbar.</p>'}
   else{html+=`<h3>Deine Antwort</h3><p class="answer">${esc(a.written_answer||'Nicht beantwortet')}</p><h3>Musterantwort</h3><p class="answer">${esc(c?.answer||'Keine Musterantwort hinterlegt.')}</p><div id="reviewAnswer-${a.id}"></div><p class="muted">Selbstbewertung: ${a.points===null?'noch offen':a.points+' von 1 Punkt'}</p>`}
   html+='</div>';
  }
  shell(html);$('#backStats').onclick=()=>go('stats');
  $('#continueGrade')?.addEventListener('click',()=>gradeExam(id));
  $('#practiceWrong').onclick=()=>{
   let wrongIds=new Set(answers.filter(a=>a.is_correct===false).map(a=>a.flashcard_id));
   let cards=answers.filter(a=>wrongIds.has(a.flashcard_id)).map(a=>state.cards.find(c=>c.id===a.flashcard_id)).filter(Boolean);
   if(!cards.length)return notify('Keine falschen Fragen zum Wiederholen vorhanden.',true);
   state.subject=exam.subject_id;state.session={cards,index:0,started:Date.now(),results:[],shown:false,choice:null,order:null};go('study')
  };
  for(let a of answers){let c=state.cards.find(x=>x.id===a.flashcard_id);if(!c)continue;
   let q=$('#reviewQuestion-'+a.id);if(q)q.innerHTML=await cardImages(c,'question');
   let ans=$('#reviewAnswer-'+a.id);if(ans)ans.innerHTML=await cardImages(c,'answer');
  }
 }catch(x){error(x)}
}
function stats(){let complete=state.exams.filter(e=>e.status==='completed'),avg=complete.length?Math.round(complete.reduce((s,e)=>s+Number(e.score||0),0)/complete.length):0,seen=state.progress.filter(p=>p.times_seen>0).length;let days={};state.sessions.forEach(s=>{let k=(s.started_at||'').slice(0,10);days[k]=(days[k]||0)+(s.cards_reviewed||0)});shell(`<h1>Dein Lernfortschritt 📈</h1><div class="grid"><div class="card"><div class="muted">Schon gelernt</div><div class="stat">${seen} / ${state.cards.length}</div></div><div class="card"><div class="muted">Fällige Karten</div><div class="stat">${state.cards.filter(due).length}</div></div><div class="card"><div class="muted">Klausur-Durchschnitt</div><div class="stat">${avg} %</div></div></div><div class="card"><h2>Lernkalender</h2>${Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30).map(([d,n])=>`<div class="list">${fmt(d)} · ${n} Karten</div>`).join('')||'<p class="muted">Noch keine Lerneinheiten.</p>'}</div><div class="card"><h2>Klausurverlauf</h2>${complete.map(e=>`<div class="list row between"><span>${esc(subjectName(e.subject_id))} · ${fmt(e.finished_at)}</span><strong>${e.score===null?'Offene Bewertung':Number(e.score).toFixed(0)+' %'}</strong><button class="secondary" data-review="${e.id}">${e.score===null?'Bewertung fortsetzen':'Alle Fragen ansehen'}</button></div>`).join('')||'<p class="muted">Noch keine Klausuren abgeschlossen.</p>'}</div><div class="card"><h2>Schwierige Karten</h2>${state.progress.filter(p=>p.times_wrong>0).sort((a,b)=>b.times_wrong-a.times_wrong).slice(0,10).map(p=>`<div class="list">${esc(state.cards.find(c=>c.id===p.flashcard_id)?.question||'Gelöschte Karte')} <span class="pill">${p.times_wrong}× falsch</span></div>`).join('')||'<p class="muted">Noch keine schwierigen Karten.</p>'}</div>`);$$('[data-review]').forEach(b=>b.onclick=()=>{state.reviewExamId=b.dataset.review;let ex=state.exams.find(x=>x.id===state.reviewExamId);if(ex?.score===null)gradeExam(state.reviewExamId);else go('examReview')})}
function download(name,data){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){shell(`<h1>Import & Export</h1><div class="card"><h2>Datensicherung</h2><p>Exportiert Fächer, Karten, Lernfortschritt, Lerneinheiten und Klausurverlauf als JSON. <strong>Wichtig:</strong> Bilder sind im Export nur als Speicherpfade enthalten, nicht als Bilddateien.</p><button id="export">JSON exportieren</button></div><div class="card"><h2>Karten importieren</h2><p>Importiere eine JSON-Datei mit einem Array von Fragen. Bestehende Fragen werden anhand des Fragetextes im ausgewählten Fach erkannt und übersprungen.</p><label>Zielfach</label><select id="importSubject">${state.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label>JSON-Datei</label><input type="file" id="importFile" accept=".json,application/json"><div id="preview"></div><div class="actions"><button id="import" disabled>Geprüfte Karten importieren</button></div><p class="muted small">Format: [{"type":"multiple_choice","question":"...","options":["A","B","C","D"],"correct_option":0}] oder [{"type":"open","question":"...","answer":"..."}]. Bilder per ZIP-Import sind noch nicht verfügbar.</p></div>`);$('#export').onclick=async()=>{try{let answers=await query('exam_answers');download(`oppia-backup-${new Date().toISOString().slice(0,10)}.json`,{format:'oppia-backup-v1',exported_at:new Date().toISOString(),subjects:state.subjects,flashcards:state.cards,study_progress:state.progress,study_sessions:state.sessions,exams:state.exams,exam_answers:answers})}catch(x){error(x)}};$('#importFile').onchange=async e=>{try{let file=e.target.files[0];if(!file)return;let obj=JSON.parse(await file.text());let items=Array.isArray(obj)?obj:obj.cards;if(!Array.isArray(items))throw Error('Erwartet wird ein Array oder ein Objekt mit „cards“.');state.importItems=items.map((c,i)=>{let type=c.type||'open',question=String(c.question||'').trim(),options=type==='multiple_choice'?c.options:null,correct=c.correct_option;let valid=question&&(type==='open'||type==='multiple_choice'&&Array.isArray(options)&&options.length>=4&&options.every(o=>typeof o==='string'&&o.trim())&&Number.isInteger(correct)&&correct>=0&&correct<options.length);return {...c,type,question,valid:!!valid,index:i}});let good=state.importItems.filter(c=>c.valid).length;$('#preview').innerHTML=`<div class="notice">${good} gültige Karten von ${items.length} Einträgen. ${items.length-good} ungültige Einträge werden übersprungen.</div>`;$('#import').disabled=!good}catch(x){state.importItems=[];$('#import').disabled=true;error(x)}};$('#import').onclick=async()=>{let id=$('#importSubject').value;if(!id)return notify('Bitte erst ein Fach erstellen.',true);let existing=new Set(cardsOf(id).map(c=>c.question.trim().toLocaleLowerCase()));let rows=[];for(let c of state.importItems.filter(c=>c.valid)){let key=c.question.toLocaleLowerCase();if(existing.has(key))continue;existing.add(key);rows.push({subject_id:id,type:c.type,question:c.question,answer:c.type==='open'?c.answer||null:null,options:c.type==='multiple_choice'?c.options:null,correct_option:c.type==='multiple_choice'?c.correct_option:null,images:[]})}if(!rows.length)return notify('Keine neuen Karten gefunden.');try{let {error:e}=await db.from('flashcards').insert(rows);if(e)throw e;await load();notify(`${rows.length} neue Karten importiert.`);state.importItems=[];$('#import').disabled=true}catch(x){error(x)}}}
async function init(){if(!window.supabase){app.innerHTML='<main><div class="card">Die Supabase-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.</div></main>';return}if(SUPABASE_KEY.includes('HIER_DEINEN')){app.innerHTML='<main class="narrow"><div class="card"><h1>Oppia einrichten 💜</h1><p>Trage oben in der <strong>index.html</strong> deinen öffentlichen Supabase-Publishable-Key in <code>SUPABASE_KEY</code> ein und lade die Datei erneut hoch.</p></div></main>';return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let {data:{session}}=await db.auth.getSession();state.user=session?.user||null;db.auth.onAuthStateChange(async(event,session)=>{if(event==='INITIAL_SESSION')return;state.user=session?.user||null;if(state.user){try{await load();go('home')}catch(e){error(e)}}else authView()});if(state.user){try{await load();go('home')}catch(e){app.innerHTML='<main><div class="card">Daten konnten nicht geladen werden. Bitte Supabase-Konfiguration und Tabellen prüfen.<pre id="err"></pre></div></main>';$('#err').textContent=e.message}}else authView()}
init().catch(e=>{console.error(e);app.innerHTML=`<main><div class="card">Fehler beim Start: ${esc(e.message)}</div></main>`});
</script></body></html>
